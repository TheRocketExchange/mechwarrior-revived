<div class="force-toolbar">
  <label class="force-name-label">Force name<input id="force-name" maxlength="80" value="My force"></label>
  <label>Game size<select id="force-size" aria-describedby="force-size-guide"></select></label>
  <label>Faction<select id="force-faction"><option value="">Mixed factions</option></select></label>
  <button type="button" id="force-new">New list</button>
  <button type="button" id="force-export">Export list</button>
  <label class="file-button">Import list<input type="file" id="force-import" accept=".json,application/json"></label>
  <label>Sample army<select id="force-sample"><option value="">Choose…</option><optgroup label="First Contact · 600 points"><option value="S1">Patrol A</option><option value="S2">Patrol B</option></optgroup><optgroup label="Standard · 1,200 points"><option value="H">H · ’Mech-heavy</option><option value="B">B · Balanced</option><option value="I">I · Infantry-heavy</option></optgroup></select></label>
  <button type="button" id="force-cards">Generate unit cards</button>
</div>
<p class="force-save-note" id="force-save" role="status">Autosaves in this browser</p>
<p id="force-message" class="force-message" role="status" aria-live="polite"></p>
<section class="force-summary" aria-labelledby="force-summary-heading">
  <h2 id="force-summary-heading">Your force</h2><div id="force-totals"></div>
  <p class="force-reference"><span id="force-size-guide"></span> · <a href="rules.html#force-organization">Force limits</a></p>
  <div id="force-checks"><p id="force-check-title" role="status" aria-live="polite"></p><ul id="force-errors"></ul></div>
</section>
<div class="force-workspace">
  <section class="force-picker" aria-labelledby="force-picker-heading">
    <h2 id="force-picker-heading">Add models</h2>
    <form id="force-filters" class="force-filters" role="search">
      <label>Find a unit<input type="search" id="force-query" placeholder="Name, catalog ID, or family…" autocomplete="off"></label>
      <label>Type<select id="force-type"><option value="">All types</option></select></label>
      <label>Show<select id="force-scope"><option value="core">Core units</option><option value="all">Full catalog</option></select></label>
    </form>
    <p id="force-results-count" class="force-save-note" aria-live="polite"></p>
    <div id="force-results"></div>
    <div class="force-pagination"><button id="force-prev" type="button">Previous</button><span id="force-page"></span><button id="force-next" type="button">Next</button></div>
  </section>
  <section class="force-roster" aria-labelledby="force-roster-heading"><h2 id="force-roster-heading">Roster</h2><div id="force-groups"></div></section>
</div>
<noscript><p>The builder needs JavaScript. Use the <a href="forces.html">sample forces</a> and <a href="downloads/revived-unit-cards.pdf">complete card PDF</a> instead.</p></noscript>
