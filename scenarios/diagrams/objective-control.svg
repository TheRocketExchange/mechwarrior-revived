<svg xmlns="http://www.w3.org/2000/svg" width="840" height="800" viewBox="0 0 840 800" role="img" aria-labelledby="title desc"><title id="title">Who controls the relay?</title><desc id="desc">Left: A is inside the three-inch ring and B is outside, so A controls and scores. Right: both centers are inside, so the relay is contested. Base centers decide control.</desc><defs>
