<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
<title id="title">Control and contest examples</title><desc id="desc">Left: side A has a center inside the ring and side B is outside, so A scores. Right: both centers are inside, so the objective is contested. Base centers decide control.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65704f"/></marker>
<pattern id="woods" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#dfe8d2"/><path d="M9 3L14 13H4Z" fill="none" stroke="#a0b18d"/></pattern>
<pattern id="rubble" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#eee4cf"/><path d="M3 9L7 5L10 11ZM13 14L16 10" fill="none" stroke="#b5a88e"/></pattern>
<pattern id="blocking" patternUnits="userSpaceOnUse" width="12" height="12"><rect width="12" height="12" fill="#d8dcd7"/><path d="M-3 3L3 -3M0 12L12 0M9 15L15 9" stroke="#a0aaa2"/></pattern>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="700" height="400" fill="#faf9f4" stroke="none" /><text x="28" y="38" font-size="26" text-anchor="start" fill="#30382e" font-weight="bold">WHO CONTROLS THE RELAY?</text><text x="175" y="80" font-size="23" text-anchor="middle" fill="#65704f" font-weight="bold">CONTROLLED</text><circle cx="175" cy="180" r="82" fill="#f0f1e7" stroke="#65704f" stroke-dasharray="6 4" stroke-width="2"/><circle cx="175" cy="180" r="4" fill="#30382e" stroke="#30382e" /><line x1="175" y1="180" x2="175" y2="98" stroke="#65704f" stroke-width="1" /><text x="185" y="135" font-size="18" text-anchor="start" fill="#30382e" font-weight="normal">3″</text><circle cx="135" cy="180" r="14" fill="#216887" stroke="#216887" /><text x="135" y="186" font-size="18" text-anchor="middle" fill="white" font-weight="bold">A</text><circle cx="290" cy="180" r="14" fill="#9b4032" stroke="#9b4032" /><text x="290" y="186" font-size="18" text-anchor="middle" fill="white" font-weight="bold">B</text><text x="175" y="300" font-size="22" text-anchor="middle" fill="#30382e" font-weight="bold">A scores 1</text><text x="525" y="80" font-size="23" text-anchor="middle" fill="#9b4032" font-weight="bold">CONTESTED</text><circle cx="525" cy="180" r="82" fill="#f0f1e7" stroke="#65704f" stroke-dasharray="6 4" stroke-width="2"/><circle cx="525" cy="180" r="4" fill="#30382e" stroke="#30382e" /><line x1="525" y1="180" x2="525" y2="98" stroke="#65704f" stroke-width="1" /><text x="535" y="135" font-size="18" text-anchor="start" fill="#30382e" font-weight="normal">3″</text><circle cx="485" cy="180" r="14" fill="#216887" stroke="#216887" /><text x="485" y="186" font-size="18" text-anchor="middle" fill="white" font-weight="bold">A</text><circle cx="565" cy="180" r="14" fill="#9b4032" stroke="#9b4032" /><text x="565" y="186" font-size="18" text-anchor="middle" fill="white" font-weight="bold">B</text><text x="525" y="300" font-size="22" text-anchor="middle" fill="#30382e" font-weight="bold">Neither side scores</text><text x="350" y="342" font-size="20" text-anchor="middle" fill="#30382e" font-weight="normal">A = your base · B = enemy base</text><text x="350" y="374" font-size="20" text-anchor="middle" fill="#30382e" font-weight="normal">Compare centers with the 3-inch ring at scoring time.</text></g></svg>
