<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
<title id="title">Movement choices at speed eight</title><desc id="desc">Advance up to four inches and make one ranged attack. Move up to eight with no attack. Rush up to sixteen with no attack. Arrows share one distance scale.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65704f"/></marker>
<pattern id="woods" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#dfe8d2"/><path d="M9 3L14 13H4Z" fill="none" stroke="#a0b18d"/></pattern>
<pattern id="rubble" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#eee4cf"/><path d="M3 9L7 5L10 11ZM13 14L16 10" fill="none" stroke="#b5a88e"/></pattern>
<pattern id="blocking" patternUnits="userSpaceOnUse" width="12" height="12"><rect width="12" height="12" fill="#d8dcd7"/><path d="M-3 3L3 -3M0 12L12 0M9 15L15 9" stroke="#a0aaa2"/></pattern>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="700" height="430" fill="#faf9f4" stroke="none" /><text x="28" y="38" font-size="26" text-anchor="start" fill="#30382e" font-weight="bold">MOVEMENT &amp; SHOOTING</text><text x="28" y="66" font-size="20" text-anchor="start" fill="#30382e" font-weight="normal">Speed 8 · no heat or equipment modifiers</text><text x="28" y="123" font-size="25" text-anchor="start" fill="#30382e" font-weight="bold">Advance</text><text x="28" y="151" font-size="18" text-anchor="start" fill="#30382e" font-weight="normal">1 ranged attack</text><circle cx="200" cy="128" r="7" fill="#216887" stroke="#216887" /><line x1="211" y1="128" x2="300" y2="128" stroke="#65704f" stroke-width="4" marker-end="url(#arrow)"/><text x="312" y="135" font-size="22" text-anchor="start" fill="#30382e" font-weight="normal">4″</text><text x="28" y="220" font-size="25" text-anchor="start" fill="#30382e" font-weight="bold">Move</text><text x="28" y="248" font-size="18" text-anchor="start" fill="#30382e" font-weight="normal">No attack</text><circle cx="200" cy="225" r="7" fill="#216887" stroke="#216887" /><line x1="211" y1="225" x2="400" y2="225" stroke="#65704f" stroke-width="4" marker-end="url(#arrow)"/><text x="412" y="232" font-size="22" text-anchor="start" fill="#30382e" font-weight="normal">8″</text><text x="28" y="317" font-size="25" text-anchor="start" fill="#30382e" font-weight="bold">Rush</text><text x="28" y="345" font-size="18" text-anchor="start" fill="#30382e" font-weight="normal">No attack</text><circle cx="200" cy="322" r="7" fill="#216887" stroke="#216887" /><line x1="211" y1="322" x2="600" y2="322" stroke="#65704f" stroke-width="4" marker-end="url(#arrow)"/><text x="612" y="329" font-size="22" text-anchor="start" fill="#30382e" font-weight="normal">16″</text><line x1="200" y1="375" x2="600" y2="375" stroke="#adb5a1" stroke-width="1" /><line x1="200" y1="370" x2="200" y2="380" stroke="#adb5a1" stroke-width="1" /><text x="200" y="403" font-size="18" text-anchor="middle" fill="#30382e" font-weight="normal">0</text><line x1="300" y1="370" x2="300" y2="380" stroke="#adb5a1" stroke-width="1" /><text x="300" y="403" font-size="18" text-anchor="middle" fill="#30382e" font-weight="normal">4</text><line x1="400" y1="370" x2="400" y2="380" stroke="#adb5a1" stroke-width="1" /><text x="400" y="403" font-size="18" text-anchor="middle" fill="#30382e" font-weight="normal">8</text><line x1="500" y1="370" x2="500" y2="380" stroke="#adb5a1" stroke-width="1" /><text x="500" y="403" font-size="18" text-anchor="middle" fill="#30382e" font-weight="normal">12</text><line x1="600" y1="370" x2="600" y2="380" stroke="#adb5a1" stroke-width="1" /><text x="600" y="403" font-size="18" text-anchor="middle" fill="#30382e" font-weight="normal">16</text><text x="28" y="403" font-size="18" text-anchor="start" fill="#30382e" font-weight="normal">Inches traveled</text></g></svg>
