OR</text><line x1="177" y1="382" x2="663" y2="382" stroke="#946416" stroke-width="4" marker-end="url(#sight-arrow)" stroke-dasharray="8 5"/><g data-unit="M1" data-center-x="3" data-center-y="4"><circle cx="179" cy="385" r="18.9" fill="#30392f" stroke="#59614f" opacity=".25"/><circle cx="177" cy="382" r="18.9" fill="#346b9e" stroke="#30392f" stroke-width="2.5"/><path d="M164.715 373.495Q177 361.21 189.285 373.495" fill="none" stroke="#91bdd5" stroke-width="2.5" stroke-linecap="round"/><path d="M172 371.1L177 365.1L182 371.1" fill="none" stroke="white" stroke-width="2" transform="rotate(90 177 382)"/><text x="177" y="387" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >M1</text></g><g data-unit="M2" data-center-x="21" data-center-y="4"><circle cx="665" cy="385" r="18.9" fill="#30392f" stroke="#59614f" opacity=".25"/><circle cx="663" cy="382" r="18.9" fill="#b5523c" stroke="#30392f" stroke-width="2.5"/><path d="M650.715 373.495Q663 361.21 675.285 373.495" fill="none" stroke="#e7aa80" stroke-width="2.5" stroke-linecap="round"/><path d="M658 371.1L663 365.1L668 371.1" fill="none" stroke="white" stroke-width="2" transform="rotate(270 663 382)"/><text x="663" y="387" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >M2</text></g><g data-unit="I1" data-center-x="11" data-center-y="7"><circle cx="395" cy="304" r="14.85" fill="#30392f" stroke="#59614f" opacity=".25"/><circle cx="393" cy="301" r="14.85" fill="#346b9e" stroke="#30392f" stroke-width="2.5"/><path d="M383.348 294.317Q393 284.665 402.652 294.317" fill="none" stroke="#91bdd5" stroke-width="2.5" stroke-linecap="round"/><text x="393" y="306" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >I1</text></g><line x1="412" y1="374" x2="428" y2="390" stroke="#b5523c" stroke-width="4" /><line x1="412" y1="390" x2="428" y2="374" stroke="#b5523c" stroke-width="4" /><rect x="322.28" y="436.5" width="199.44" height="25" fill="#30392f" stroke="none" opacity=".25" rx="2"/><rect x="320.28" y="434.5" width="199.44" height="25" fill="#eee9d8" stroke="#b5523c" stroke-width="2" rx="2"/><text x="420" y="451.5" font-size="16" text-anchor="middle" fill="#b5523c" font-weight="bold" >DIRECT FIRE BLOCKED</text><g data-measure="smoke-radius" data-axis="x" data-distance="3"><line x1="420" y1="328" x2="501" y2="328" stroke="#eee9d8" stroke-width="3.5" opacity=".85"/><line x1="420" y1="328" x2="501" y2="328" stroke="#30392f" stroke-width="1.2" data-dimension-line="true" marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/><rect x="445.5" y="305.5" width="30" height="18" fill="#eee9d8" stroke="none" rx="2"/><text x="460.5" y="319.5" font-size="14" text-anchor="middle" fill="#30392f" font-weight="bold" >3″</text></g><text x="96" y="535" font-size="20" text-anchor="start" fill="#30392f" font-weight="bold" >I1 operated the generator. Smoke fills the 3-inch ring.</text><text x="96" y="572" font-size="17" text-anchor="start" fill="#30392f" font-weight="normal" >M1 cannot shoot M2 through the cloud. M2 cannot shoot I1 inside it.</text><text x="96" y="605" font-size="17" text-anchor="start" fill="#30392f" font-weight="normal" >Movement, close attacks, and indirect Rockets still work normally.</text><text x="96" y="638" font-size="17" text-anchor="start" fill="#30392f" font-weight="normal" >Remove smoke at the start of the next round, after this round’s scoring.</text><text x="96" y="678" font-size="16" text-anchor="start" fill="#59614f" font-weight="normal" >Assume range and facing are legal. M = ’Mech; I = infantry. Grid = 2 inches.</text><line x1="28" y1="709" x2="812" y2="709" stroke="#aaa991" stroke-width="2" /><text x="28" y="732" font-size="12" text-anchor="start" fill="#59614f" font-weight="bold" >MECHWARRIOR REVIVED</text><text x="812" y="732" font-size="11" text-anchor="end" fill="#59614f" font-weight="normal" >SETUP &amp; RULES EXAMPLES</text></g></svg>
