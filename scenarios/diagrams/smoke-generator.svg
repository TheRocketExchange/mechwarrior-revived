<svg xmlns="http://www.w3.org/2000/svg" width="840" height="752" viewBox="0 0 840 752" role="img" aria-labelledby="title desc"><title id="title">Smoke generator</title><desc id="desc">Infantry I1 has operated a generator, filling its three-inch radius with smoke. A direct shot from M1 to M2 crosses the cloud and is blocked. Shots into the cloud are also blocked. Movement, close attacks, and indirect Rocket fire are unaffected. Smoke clears at the start of the next round.</desc><defs>
