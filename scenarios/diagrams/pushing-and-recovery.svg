</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="840" height="580" fill="#eee9d8" stroke="none" /><rect x="0" y="5" width="840" height="82" fill="#b7b39e" stroke="none" /><rect x="0" y="0" width="840" height="82" fill="#4b6171" stroke="#30392f" stroke-width="4"/><line x1="0" y1="4" x2="840" y2="4" stroke="#8198a1" stroke-width="4" /><text x="28" y="25" font-size="12" text-anchor="start" fill="#d5dfce" font-weight="bold" letter-spacing="1">EXAMPLE 05  /  READINESS</text><text x="29" y="63" font-size="29" text-anchor="start" fill="#30392f" font-weight="bold" >Pushing &amp; recovery</text><text x="28" y="60" font-size="29" text-anchor="start" fill="#fff6d9" font-weight="bold" >Pushing &amp; recovery</text><text x="28" y="111" font-size="18" text-anchor="start" fill="#59614f" font-weight="normal" >Readiness stays between rounds</text><rect x="27" y="158" width="248" height="266" fill="#aaa98c" stroke="none" /><rect x="24" y="154" width="248" height="266" fill="#d7dcc3" stroke="#30392f" stroke-width="3"/><rect x="24" y="154" width="248" height="47" fill="#4b6171" stroke="#30392f" stroke-width="3"/><text x="148" y="185" font-size="22" text-anchor="middle" fill="#fff6d9" font-weight="bold" >1 · FIRE</text><text x="148" y="245" font-size="23" text-anchor="middle" fill="#30392f" font-weight="normal" >Ready</text><line x1="148" y1="262" x2="148" y2="299" stroke="#346b9e" stroke-width="3" marker-end="url(#move-arrow)"/><text x="148" y="337" font-size="25" text-anchor="middle" fill="#346b9e" font-weight="bold" >Committed</text><text x="148" y="376" font-size="16" text-anchor="middle" fill="#30392f" font-weight="normal" >No pushing damage</text><text x="148" y="401" font-size="16" text-anchor="middle" fill="#30392f" font-weight="normal" ></text><rect x="299" y="158" width="248" height="266" fill="#aaa98c" stroke="none" /><rect x="296" y="154" width="248" height="266" fill="#d7dcc3" stroke="#30392f" stroke-width="3"/><rect x="296" y="154" width="248" height="47" fill="#4b6171" stroke="#30392f" stroke-width="3"/><text x="420" y="185" font-size="22" text-anchor="middle" fill="#fff6d9" font-weight="bold" >2 · FIRE</text><text x="420" y="245" font-size="23" text-anchor="middle" fill="#30392f" font-weight="normal" >Committed</text><line x1="420" y1="262" x2="420" y2="299" stroke="#346b9e" stroke-width="3" marker-end="url(#move-arrow)"/><text x="420" y="337" font-size="25" text-anchor="middle" fill="#b5523c" font-weight="bold" >Spent</text><text x="420" y="376" font-size="16" text-anchor="middle" fill="#30392f" font-weight="normal" >1 damage per surviving base</text><text x="420" y="401" font-size="16" text-anchor="middle" fill="#30392f" font-weight="normal" >after its action</text><rect x="571" y="158" width="248" height="266" fill="#aaa98c" stroke="none" /><rect x="568" y="154" width="248" height="266" fill="#d7dcc3" stroke="#30392f" stroke-width="3"/><rect x="568" y="154" width="248" height="47" fill="#4b6171" stroke="#30392f" stroke-width="3"/><text x="692" y="185" font-size="22" text-anchor="middle" fill="#fff6d9" font-weight="bold" >3 · MOVE / HOLD</text><text x="692" y="245" font-size="23" text-anchor="middle" fill="#30392f" font-weight="normal" >Spent</text><line x1="692" y1="262" x2="692" y2="299" stroke="#346b9e" stroke-width="3" marker-end="url(#move-arrow)"/><text x="692" y="337" font-size="25" text-anchor="middle" fill="#346b9e" font-weight="bold" >Ready</text><text x="692" y="376" font-size="16" text-anchor="middle" fill="#30392f" font-weight="normal" >Recover; no attack</text><text x="692" y="401" font-size="16" text-anchor="middle" fill="#30392f" font-weight="normal" ></text><text x="28" y="467" font-size="20" text-anchor="start" fill="#30392f" font-weight="normal" >One vehicle or squad. Each step is a separate activation.</text><text x="28" y="503" font-size="18" text-anchor="start" fill="#30392f" font-weight="normal" >Recover early from Committed to avoid pushing. ’Mechs use heat instead.</text><line x1="28" y1="537" x2="812" y2="537" stroke="#aaa991" stroke-width="2" /><text x="28" y="560" font-size="12" text-anchor="start" fill="#59614f" font-weight="bold" >MECHWARRIOR REVIVED</text><text x="812" y="560" font-size="11" text-anchor="end" fill="#59614f" font-weight="normal" >SETUP &amp; RULES EXAMPLES</text></g></svg>
