<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" role="img" aria-labelledby="title desc"><title id="title">Pushing &amp; recovery</title><desc id="desc">First Fire changes Ready to Committed. A second Fire changes Committed to Spent and each surviving base takes one pushing damage after acting. Move or Hold recovers to Ready. Recovering early avoids pushing.</desc><defs>
<pattern id="woods" patternUnits="userSpaceOnUse" width="26" height="26"><rect width="26" height="26" fill="#d4dfbf"/><path d="M13 3L20 17H6Z M13 14V22" fill="#a9be8e" stroke="#788f60" stroke-width="1.2"/></pattern>
<pattern id="rubble" patternUnits="userSpaceOnUse" width="28" height="26"><rect width="28" height="26" fill="#e3d7bd"/><path d="M3 8L10 4L13 13L5 15Z M17 19L23 12L27 22Z" fill="#bdaf94" stroke="#918164"/><path d="M16 3L21 6M4 22L9 20" stroke="#9f8c6b"/></pattern>
<pattern id="blocking" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#b7bdc3"/><path d="M0 24L24 0M-6 6L6 -6M18 30L30 18" stroke="#85919c" stroke-width="2"/></pattern>
<pattern id="fieldworks" patternUnits="userSpaceOnUse" width="28" height="24"><rect width="28" height="24" fill="#ddcbaa"/><path d="M0 7H9V17H19V7H28" fill="none" stroke="#806044" stroke-width="5"/><path d="M0 7H9V17H19V7H28" fill="none" stroke="#b79a70" stroke-width="2"/></pattern>
<pattern id="water" patternUnits="userSpaceOnUse" width="28" height="20"><rect width="28" height="20" fill="#ccdde5"/><path d="M0 10Q7 5 14 10T28 10" fill="none" stroke="#86a6b7"/></pattern>
<marker id="move-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245e94"/></marker>
<marker id="sight-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#926818"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="840" height="580" fill="#f4f7fa" stroke="none" /><rect x="0" y="0" width="840" height="82" fill="#344f70" stroke="none" /><text x="28" y="25" font-size="12" text-anchor="start" fill="#c5d8ec" font-weight="bold" letter-spacing="2">EXAMPLE 05  /  READINESS</text><text x="28" y="60" font-size="29" text-anchor="start" fill="white" font-weight="bold" >Pushing &amp; recovery</text><text x="28" y="111" font-size="18" text-anchor="start" fill="#52677e" font-weight="normal" >Readiness stays between rounds</text><rect x="24" y="154" width="248" height="266" fill="#e3ebf4" stroke="#a3b5cb" /><rect x="24" y="154" width="248" height="47" fill="#435f80" stroke="none" /><text x="148" y="185" font-size="22" text-anchor="middle" fill="white" font-weight="bold" >1 · FIRE</text><text x="148" y="245" font-size="23" text-anchor="middle" fill="#243448" font-weight="normal" >Ready</text><line x1="148" y1="262" x2="148" y2="299" stroke="#245e94" stroke-width="3" marker-end="url(#move-arrow)"/><text x="148" y="337" font-size="25" text-anchor="middle" fill="#245e94" font-weight="bold" >Committed</text><text x="148" y="376" font-size="16" text-anchor="middle" fill="#243448" font-weight="normal" >No pushing damage</text><text x="148" y="401" font-size="16" text-anchor="middle" fill="#243448" font-weight="normal" ></text><rect x="296" y="154" width="248" height="266" fill="#e3ebf4" stroke="#a3b5cb" /><rect x="296" y="154" width="248" height="47" fill="#435f80" stroke="none" /><text x="420" y="185" font-size="22" text-anchor="middle" fill="white" font-weight="bold" >2 · FIRE</text><text x="420" y="245" font-size="23" text-anchor="middle" fill="#243448" font-weight="normal" >Committed</text><line x1="420" y1="262" x2="420" y2="299" stroke="#245e94" stroke-width="3" marker-end="url(#move-arrow)"/><text x="420" y="337" font-size="25" text-anchor="middle" fill="#a54a35" font-weight="bold" >Spent</text><text x="420" y="376" font-size="16" text-anchor="middle" fill="#243448" font-weight="normal" >1 damage per surviving base</text><text x="420" y="401" font-size="16" text-anchor="middle" fill="#243448" font-weight="normal" >after its action</text><rect x="568" y="154" width="248" height="266" fill="#e3ebf4" stroke="#a3b5cb" /><rect x="568" y="154" width="248" height="47" fill="#435f80" stroke="none" /><text x="692" y="185" font-size="22" text-anchor="middle" fill="white" font-weight="bold" >3 · MOVE / HOLD</text><text x="692" y="245" font-size="23" text-anchor="middle" fill="#243448" font-weight="normal" >Spent</text><line x1="692" y1="262" x2="692" y2="299" stroke="#245e94" stroke-width="3" marker-end="url(#move-arrow)"/><text x="692" y="337" font-size="25" text-anchor="middle" fill="#245e94" font-weight="bold" >Ready</text><text x="692" y="376" font-size="16" text-anchor="middle" fill="#243448" font-weight="normal" >Recover; no attack</text><text x="692" y="401" font-size="16" text-anchor="middle" fill="#243448" font-weight="normal" ></text><text x="28" y="467" font-size="20" text-anchor="start" fill="#243448" font-weight="normal" >One vehicle or squad. Each step is a separate activation.</text><text x="28" y="503" font-size="18" text-anchor="start" fill="#243448" font-weight="normal" >Recover early from Committed to avoid pushing. ’Mechs use heat instead.</text><line x1="28" y1="537" x2="812" y2="537" stroke="#b4c3d4" stroke-width="1" /><text x="28" y="560" font-size="12" text-anchor="start" fill="#52677e" font-weight="bold" >MECHWARRIOR REVIVED</text><text x="812" y="560" font-size="11" text-anchor="end" fill="#52677e" font-weight="normal" >SETUP &amp; RULES EXAMPLES</text></g></svg>
