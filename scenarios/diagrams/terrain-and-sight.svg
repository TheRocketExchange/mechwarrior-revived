<svg xmlns="http://www.w3.org/2000/svg" width="840" height="850" viewBox="0 0 840 850" role="img" aria-labelledby="title desc"><title id="title">Terrain &amp; line of sight</title><desc id="desc">The upper shot reaches infantry inside woods: sight is clear and infantry receives three ranged defense from cover. The lower shot crosses a blocking building and is illegal. Models have valid range and front arcs.</desc><defs>
<pattern id="woods" patternUnits="userSpaceOnUse" width="26" height="26"><rect width="26" height="26" fill="#d4dfbf"/><path d="M13 3L20 17H6Z M13 14V22" fill="#a9be8e" stroke="#788f60" stroke-width="1.2"/></pattern>
<pattern id="rubble" patternUnits="userSpaceOnUse" width="28" height="26"><rect width="28" height="26" fill="#e3d7bd"/><path d="M3 8L10 4L13 13L5 15Z M17 19L23 12L27 22Z" fill="#bdaf94" stroke="#918164"/><path d="M16 3L21 6M4 22L9 20" stroke="#9f8c6b"/></pattern>
<pattern id="blocking" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#b7bdc3"/><path d="M0 24L24 0M-6 6L6 -6M18 30L30 18" stroke="#85919c" stroke-width="2"/></pattern>
<pattern id="fieldworks" patternUnits="userSpaceOnUse" width="28" height="24"><rect width="28" height="24" fill="#ddcbaa"/><path d="M0 7H9V17H19V7H28" fill="none" stroke="#806044" stroke-width="5"/><path d="M0 7H9V17H19V7H28" fill="none" stroke="#b79a70" stroke-width="2"/></pattern>
<pattern id="water" patternUnits="userSpaceOnUse" width="28" height="20"><rect width="28" height="20" fill="#ccdde5"/><path d="M0 10Q7 5 14 10T28 10" fill="none" stroke="#86a6b7"/></pattern>
<marker id="move-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245e94"/></marker>
<marker id="sight-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#926818"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="840" height="850" fill="#f4f7fa" stroke="none" /><rect x="0" y="0" width="840" height="82" fill="#344f70" stroke="none" /><text x="28" y="25" font-size="12" text-anchor="start" fill="#c5d8ec" font-weight="bold" letter-spacing="2">EXAMPLE 03  /  TERRAIN</text><text x="28" y="60" font-size="29" text-anchor="start" fill="white" font-weight="bold" >Terrain &amp; line of sight</text><text x="28" y="111" font-size="18" text-anchor="start" fill="#52677e" font-weight="normal" >Check the line between base centers, then the target’s terrain</text><rect x="96" y="166" width="648" height="432" fill="#ece9dc" stroke="#243448" data-board-width="24" data-board-depth="16" data-scale="27" stroke-width="2"/><line x1="96" y1="166" x2="96" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="150" y1="166" x2="150" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="204" y1="166" x2="204" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="258" y1="166" x2="258" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="312" y1="166" x2="312" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="366" y1="166" x2="366" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="420" y1="166" x2="420" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="474" y1="166" x2="474" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="528" y1="166" x2="528" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="582" y1="166" x2="582" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="636" y1="166" x2="636" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="690" y1="166" x2="690" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="744" y1="166" x2="744" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="598" x2="744" y2="598" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="544" x2="744" y2="544" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="490" x2="744" y2="490" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="436" x2="744" y2="436" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="382" x2="744" y2="382" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="328" x2="744" y2="328" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="274" x2="744" y2="274" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="220" x2="744" y2="220" stroke="#c7cabb" stroke-width="1" /><line x1="96" y1="166" x2="744" y2="166" stroke="#c7cabb" stroke-width="1" /><rect x="366" y="220" width="162" height="108" fill="url(#woods)" stroke="#63794e" stroke-width="2" data-terrain="W1" data-kind="woods"/><rect x="428" y="224" width="38" height="21" fill="#f4f7fa" stroke="#243448" stroke-width="1"/><text x="447" y="237" font-size="12" text-anchor="middle" fill="#243448" font-weight="bold" >W1</text><rect x="339" y="436" width="162" height="108" fill="url(#blocking)" stroke="#52606e" stroke-width="2" data-terrain="B1" data-kind="blocking"/><rect x="345" y="442" width="150" height="96" fill="#a4adb5" stroke="#677685" /><line x1="345" y1="442" x2="495" y2="538" stroke="#87949f" stroke-width="1" /><line x1="345" y1="538" x2="495" y2="442" stroke="#87949f" stroke-width="1" /><rect x="401" y="440" width="38" height="21" fill="#f4f7fa" stroke="#243448" stroke-width="1"/><text x="420" y="453" font-size="12" text-anchor="middle" fill="#243448" font-weight="bold" >B1</text><line x1="177" y1="274" x2="447" y2="274" stroke="#926818" stroke-width="3" marker-end="url(#sight-arrow)" stroke-dasharray="8 5"/><line x1="177" y1="490" x2="663" y2="490" stroke="#926818" stroke-width="3" marker-end="url(#sight-arrow)" stroke-dasharray="8 5"/><g data-unit="M1" data-center-x="3" data-center-y="12"><circle cx="177" cy="274" r="18.9" fill="#245e94" stroke="#245e94" stroke-width="2"/><path d="M172 263.1L177 257.1L182 263.1" fill="none" stroke="white" stroke-width="2" transform="rotate(90 177 274)"/><text x="177" y="279" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >M1</text></g><g data-unit="I1" data-center-x="13" data-center-y="12"><circle cx="447" cy="274" r="18.9" fill="#a54a35" stroke="#a54a35" stroke-width="2"/><text x="447" y="279" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >I1</text></g><g data-unit="M2" data-center-x="3" data-center-y="4"><circle cx="177" cy="490" r="18.9" fill="#245e94" stroke="#245e94" stroke-width="2"/><path d="M172 479.1L177 473.1L182 479.1" fill="none" stroke="white" stroke-width="2" transform="rotate(90 177 490)"/><text x="177" y="495" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >M2</text></g><g data-unit="M3" data-center-x="21" data-center-y="4"><circle cx="663" cy="490" r="18.9" fill="#a54a35" stroke="#a54a35" stroke-width="2"/><path d="M658 479.1L663 473.1L668 479.1" fill="none" stroke="white" stroke-width="2" transform="rotate(270 663 490)"/><text x="663" y="495" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >M3</text></g><rect x="227.675" y="197.9" width="114.65" height="24" fill="#f4f7fa" stroke="#245e94" stroke-width="1"/><text x="285" y="213.9" font-size="15" text-anchor="middle" fill="#245e94" font-weight="bold" >CLEAR SIGHT</text><rect x="529.195" y="199.9" width="148.81" height="22" fill="#f4f7fa" stroke="#a54a35" stroke-width="1"/><text x="603.6" y="213.9" font-size="13" text-anchor="middle" fill="#a54a35" font-weight="bold" >INFANTRY IN WOODS</text><rect x="378.84" y="380.5" width="82.32" height="25" fill="#f4f7fa" stroke="#a54a35" stroke-width="1"/><text x="420" y="397.5" font-size="16" text-anchor="middle" fill="#a54a35" font-weight="bold" >BLOCKED</text><line x1="412" y1="482" x2="428" y2="498" stroke="#a54a35" stroke-width="4" /><line x1="412" y1="498" x2="428" y2="482" stroke="#a54a35" stroke-width="4" /><rect x="96" y="633" width="32" height="25" fill="url(#woods)" stroke="#63794e" /><text x="139" y="651" font-size="17" text-anchor="start" fill="#243448" font-weight="normal" >Woods</text><rect x="276" y="633" width="32" height="25" fill="url(#blocking)" stroke="#52606e" /><text x="319" y="651" font-size="17" text-anchor="start" fill="#243448" font-weight="normal" >Blocking</text><line x1="510" y1="646" x2="555" y2="646" stroke="#926818" stroke-width="3" stroke-dasharray="8 5"/><text x="568" y="652" font-size="17" text-anchor="start" fill="#243448" font-weight="normal" >Sight line</text><text x="96" y="704" font-size="17" text-anchor="start" fill="#243448" font-weight="normal" >Top: woods do not block sight. I1 gets +3 ranged defense for being in woods.</text><text x="96" y="736" font-size="17" text-anchor="start" fill="#243448" font-weight="normal" >Bottom: the building blocks the line between the two base centers.</text><text x="96" y="776" font-size="16" text-anchor="start" fill="#52677e" font-weight="normal" >Assume range and front arc are legal. M = ’Mech; I = infantry. Grid = 2 inches.</text><line x1="28" y1="807" x2="812" y2="807" stroke="#b4c3d4" stroke-width="1" /><text x="28" y="830" font-size="12" text-anchor="start" fill="#52677e" font-weight="bold" >MECHWARRIOR REVIVED</text><text x="812" y="830" font-size="11" text-anchor="end" fill="#52677e" font-weight="normal" >SETUP &amp; RULES EXAMPLES</text></g></svg>
