<svg xmlns="http://www.w3.org/2000/svg" width="840" height="738" viewBox="0 0 840 738" role="img" aria-labelledby="title desc"><title id="title">Moving through woods</title><desc id="desc">The model moves four inches through open ground, four through woods, then four through open ground. Twelve inches traveled costs sixteen movement because woods cost two per inch. A speed-eight Mech can Rush along the route.</desc><defs>
