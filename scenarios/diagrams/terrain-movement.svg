8 38.64 31.24 36.54C28.16 34.86 27.72 42 22 42C16.28 42 15.4 36.96 11.44 37.8C5.28 40.32 0.44 35.28 3.08 29.82C4.4 26.04 0 24.78 0 21Z" fill="url(#woods)" stroke="#35452f" stroke-width="2.5" stroke-linejoin="round"/></svg><text x="133" y="491" font-size="17" text-anchor="start" fill="#30392f" font-weight="normal" >Woods</text><text x="90" y="548" font-size="25" text-anchor="start" fill="#30392f" font-weight="bold" >12 inches traveled = 16 inches of movement</text><text x="90" y="588" font-size="21" text-anchor="start" fill="#346b9e" font-weight="normal" >4 open + (4 woods × 2) + 4 open = 16</text><text x="90" y="634" font-size="18" text-anchor="start" fill="#30392f" font-weight="normal" >A speed-8 ’Mech can cover this route with Rush; it cannot attack.</text><text x="90" y="664" font-size="17" text-anchor="start" fill="#59614f" font-weight="normal" >No heat or equipment modifiers. Each grid square is 2 inches.</text><line x1="28" y1="695" x2="812" y2="695" stroke="#aaa991" stroke-width="2" /><text x="28" y="718" font-size="12" text-anchor="start" fill="#59614f" font-weight="bold" >MECHWARRIOR REVIVED</text><text x="812" y="718" font-size="11" text-anchor="end" fill="#59614f" font-weight="normal" >SETUP &amp; RULES EXAMPLES</text></g></svg>
