<svg xmlns="http://www.w3.org/2000/svg" width="840" height="738" viewBox="0 0 840 738" role="img" aria-labelledby="title desc"><title id="title">Moving through woods</title><desc id="desc">The model moves four inches through open ground, four through woods, then four through open ground. Twelve inches traveled costs sixteen movement because woods cost two per inch. A speed-eight Mech can Rush along the route.</desc><defs>
<pattern id="woods" patternUnits="userSpaceOnUse" width="26" height="26"><rect width="26" height="26" fill="#d4dfbf"/><path d="M13 3L20 17H6Z M13 14V22" fill="#a9be8e" stroke="#788f60" stroke-width="1.2"/></pattern>
<pattern id="rubble" patternUnits="userSpaceOnUse" width="28" height="26"><rect width="28" height="26" fill="#e3d7bd"/><path d="M3 8L10 4L13 13L5 15Z M17 19L23 12L27 22Z" fill="#bdaf94" stroke="#918164"/><path d="M16 3L21 6M4 22L9 20" stroke="#9f8c6b"/></pattern>
<pattern id="blocking" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#b7bdc3"/><path d="M0 24L24 0M-6 6L6 -6M18 30L30 18" stroke="#85919c" stroke-width="2"/></pattern>
<pattern id="fieldworks" patternUnits="userSpaceOnUse" width="28" height="24"><rect width="28" height="24" fill="#ddcbaa"/><path d="M0 7H9V17H19V7H28" fill="none" stroke="#806044" stroke-width="5"/><path d="M0 7H9V17H19V7H28" fill="none" stroke="#b79a70" stroke-width="2"/></pattern>
<pattern id="water" patternUnits="userSpaceOnUse" width="28" height="20"><rect width="28" height="20" fill="#ccdde5"/><path d="M0 10Q7 5 14 10T28 10" fill="none" stroke="#86a6b7"/></pattern>
<marker id="move-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245e94"/></marker>
<marker id="sight-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#926818"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="840" height="738" fill="#f4f7fa" stroke="none" /><rect x="0" y="0" width="840" height="82" fill="#344f70" stroke="none" /><text x="28" y="25" font-size="12" text-anchor="start" fill="#c5d8ec" font-weight="bold" letter-spacing="2">EXAMPLE 04  /  MOVEMENT COST</text><text x="28" y="60" font-size="29" text-anchor="start" fill="white" font-weight="bold" >Moving through woods</text><text x="28" y="111" font-size="18" text-anchor="start" fill="#52677e" font-weight="normal" >Measure the route and pay for each terrain segment</text><rect x="90" y="178" width="660" height="264" fill="#ece9dc" stroke="#243448" data-board-width="20" data-board-depth="8" data-scale="33" stroke-width="2"/><line x1="90" y1="178" x2="90" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="156" y1="178" x2="156" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="222" y1="178" x2="222" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="288" y1="178" x2="288" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="354" y1="178" x2="354" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="420" y1="178" x2="420" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="486" y1="178" x2="486" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="552" y1="178" x2="552" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="618" y1="178" x2="618" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="684" y1="178" x2="684" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="750" y1="178" x2="750" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="90" y1="442" x2="750" y2="442" stroke="#c7cabb" stroke-width="1" /><line x1="90" y1="376" x2="750" y2="376" stroke="#c7cabb" stroke-width="1" /><line x1="90" y1="310" x2="750" y2="310" stroke="#c7cabb" stroke-width="1" /><line x1="90" y1="244" x2="750" y2="244" stroke="#c7cabb" stroke-width="1" /><line x1="90" y1="178" x2="750" y2="178" stroke="#c7cabb" stroke-width="1" /><rect x="321" y="244" width="132" height="132" fill="url(#woods)" stroke="#63794e" stroke-width="2" data-terrain="W1" data-kind="woods"/><rect x="368" y="248" width="38" height="21" fill="#f4f7fa" stroke="#243448" stroke-width="1"/><text x="387" y="261" font-size="12" text-anchor="middle" fill="#243448" font-weight="bold" >W1</text><line x1="189" y1="310" x2="585" y2="310" stroke="#245e94" stroke-width="3" marker-end="url(#move-arrow)"/><g data-unit="M1" data-center-x="3" data-center-y="4" opacity="0.48"><circle cx="189" cy="310" r="19.8" fill="#f4f7fa" stroke="#245e94" stroke-width="2"/><path d="M184 298.2L189 292.2L194 298.2" fill="none" stroke="#245e94" stroke-width="2" transform="rotate(90 189 310)"/><text x="189" y="315" font-size="13" text-anchor="middle" fill="#245e94" font-weight="bold" >M1</text></g><g data-unit="M1" data-center-x="15" data-center-y="4"><circle cx="585" cy="310" r="19.8" fill="#245e94" stroke="#245e94" stroke-width="2"/><path d="M580 298.2L585 292.2L590 298.2" fill="none" stroke="white" stroke-width="2" transform="rotate(90 585 310)"/><text x="585" y="315" font-size="13" text-anchor="middle" fill="white" font-weight="bold" >M1</text></g><rect x="213.84" y="196" width="82.32" height="25" fill="#f4f7fa" stroke="#245e94" stroke-width="1"/><text x="255" y="213" font-size="16" text-anchor="middle" fill="#245e94" font-weight="bold" >4″ open</text><rect x="340.96" y="196" width="92.08" height="25" fill="#f4f7fa" stroke="#245e94" stroke-width="1"/><text x="387" y="213" font-size="16" text-anchor="middle" fill="#245e94" font-weight="bold" >4″ woods</text><rect x="477.84" y="196" width="82.32" height="25" fill="#f4f7fa" stroke="#245e94" stroke-width="1"/><text x="519" y="213" font-size="16" text-anchor="middle" fill="#245e94" font-weight="bold" >4″ open</text><rect x="90" y="473" width="32" height="25" fill="url(#woods)" stroke="#63794e" /><text x="133" y="491" font-size="17" text-anchor="start" fill="#243448" font-weight="normal" >Woods</text><text x="90" y="548" font-size="25" text-anchor="start" fill="#243448" font-weight="bold" >12 inches traveled = 16 inches of movement</text><text x="90" y="588" font-size="21" text-anchor="start" fill="#245e94" font-weight="normal" >4 open + (4 woods × 2) + 4 open = 16</text><text x="90" y="634" font-size="18" text-anchor="start" fill="#243448" font-weight="normal" >A speed-8 ’Mech can cover this route with Rush; it cannot attack.</text><text x="90" y="664" font-size="17" text-anchor="start" fill="#52677e" font-weight="normal" >No heat or equipment modifiers. Each grid square is 2 inches.</text><line x1="28" y1="695" x2="812" y2="695" stroke="#b4c3d4" stroke-width="1" /><text x="28" y="718" font-size="12" text-anchor="start" fill="#52677e" font-weight="bold" >MECHWARRIOR REVIVED</text><text x="812" y="718" font-size="11" text-anchor="end" fill="#52677e" font-weight="normal" >SETUP &amp; RULES EXAMPLES</text></g></svg>
