<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" role="img" aria-labelledby="title desc">
<title id="title">Three activation readiness example</title><desc id="desc">First Fire changes Ready to Committed. A second Fire changes Committed to Spent and each surviving base pays one pushing damage after its action. Move or Hold recovers to Ready. Mechs use heat instead.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65704f"/></marker>
<pattern id="woods" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#dfe8d2"/><path d="M9 3L14 13H4Z" fill="none" stroke="#a0b18d"/></pattern>
<pattern id="rubble" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#eee4cf"/><path d="M3 9L7 5L10 11ZM13 14L16 10" fill="none" stroke="#b5a88e"/></pattern>
<pattern id="blocking" patternUnits="userSpaceOnUse" width="12" height="12"><rect width="12" height="12" fill="#d8dcd7"/><path d="M-3 3L3 -3M0 12L12 0M9 15L15 9" stroke="#a0aaa2"/></pattern>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="700" height="390" fill="#faf9f4" stroke="none" /><text x="28" y="38" font-size="26" text-anchor="start" fill="#30382e" font-weight="bold">PUSHING &amp; RECOVERY</text><rect x="20" y="72" width="200" height="216" fill="#eeefe5" stroke="#bdc4b3" /><text x="120" y="108" font-size="22" text-anchor="middle" fill="#30382e" font-weight="bold">1 · Fire</text><text x="120" y="151" font-size="21" text-anchor="middle" fill="#30382e" font-weight="normal">Ready</text><line x1="120" y1="164" x2="120" y2="188" stroke="#65704f" stroke-width="2" marker-end="url(#arrow)"/><text x="120" y="218" font-size="23" text-anchor="middle" fill="#65704f" font-weight="bold">Committed</text><text x="120" y="253" font-size="17" text-anchor="middle" fill="#30382e" font-weight="normal">No pushing damage</text><text x="120" y="276" font-size="17" text-anchor="middle" fill="#30382e" font-weight="normal"></text><rect x="250" y="72" width="200" height="216" fill="#eeefe5" stroke="#bdc4b3" /><text x="350" y="108" font-size="22" text-anchor="middle" fill="#30382e" font-weight="bold">2 · Fire</text><text x="350" y="151" font-size="21" text-anchor="middle" fill="#30382e" font-weight="normal">Committed</text><line x1="350" y1="164" x2="350" y2="188" stroke="#65704f" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="218" font-size="23" text-anchor="middle" fill="#9b4032" font-weight="bold">Spent</text><text x="350" y="253" font-size="17" text-anchor="middle" fill="#30382e" font-weight="normal">1 damage per base</text><text x="350" y="276" font-size="17" text-anchor="middle" fill="#30382e" font-weight="normal">after its action</text><rect x="480" y="72" width="200" height="216" fill="#eeefe5" stroke="#bdc4b3" /><text x="580" y="108" font-size="22" text-anchor="middle" fill="#30382e" font-weight="bold">3 · Move / Hold</text><text x="580" y="151" font-size="21" text-anchor="middle" fill="#30382e" font-weight="normal">Spent</text><line x1="580" y1="164" x2="580" y2="188" stroke="#65704f" stroke-width="2" marker-end="url(#arrow)"/><text x="580" y="218" font-size="23" text-anchor="middle" fill="#65704f" font-weight="bold">Ready</text><text x="580" y="253" font-size="17" text-anchor="middle" fill="#30382e" font-weight="normal">Recover; no attack</text><text x="580" y="276" font-size="17" text-anchor="middle" fill="#30382e" font-weight="normal"></text><text x="350" y="330" font-size="20" text-anchor="middle" fill="#30382e" font-weight="normal">One vehicle or squad · one activation per step</text><text x="350" y="364" font-size="20" text-anchor="middle" fill="#30382e" font-weight="normal">Recover early from Committed to avoid pushing.</text></g></svg>
